# Publishes the IDX Stock Forecast Web UI to GitHub Pages with fresh data.
# GitHub Pages cannot run Python, so this job does what server.py would do (prices + Deep Forecast)
# and publishes the answers as JSON files next to the page (see idx_trend_studio/build_static.py).
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish to GitHub Pages

on:
  # GitHub can start a scheduled run hours late, so the day's close is tried several times.
  # A run whose Yahoo data is older than the site already online publishes nothing.
  schedule:
    - cron: "30 9 * * 1-5"     # 16:30 WIB, Monday-Friday, after the IDX close
    - cron: "30 11 * * 1-5"    # 18:30 WIB, backup
    - cron: "30 13 * * 1-5"    # 20:30 WIB, backup
    - cron: "30 0 * * 2-6"     # 07:30 WIB the next morning (Tuesday-Saturday), last backup
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "idx_trend_studio/static/**"
      - "idx_trend_studio/build_static.py"
      - "idx_trend_studio/server.py"
      - "idx_trend_studio/idx_source.py"
      - "deep_forecast.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      stale: ${{ steps.build.outputs.stale }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install yfinance pandas numpy scipy scikit-learn xgboost statsmodels

      - name: Read the date of the data now online
        id: live
        run: |
          last=$(curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/status.json"                  | python -c "import json,sys; print(json.load(sys.stdin).get('last_bar',''))" 2>/dev/null || true)
          echo "Data online up to: ${last:-unknown}"
          echo "last_bar=$last" >> "$GITHUB_OUTPUT"

      - name: Build the site (prices + Deep Forecast)
        id: build
        working-directory: idx_trend_studio
        run: python build_static.py --out ../site ${{ steps.live.outputs.last_bar && format('--min-last-bar {0}', steps.live.outputs.last_bar) || '' }}

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.stale != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.stale != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.stale != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
